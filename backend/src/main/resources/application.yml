server:
  port: ${PORT:8080}

spring:
  application:
    name: keystone

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USER:keystone}
    password: ${DB_PASSWORD:keystone}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

keystone:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-value-in-every-real-environment-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sla:
    minutes:
      URGENT: ${SLA_URGENT_MINUTES:240}
      HIGH: ${SLA_HIGH_MINUTES:1440}
      MEDIUM: ${SLA_MEDIUM_MINUTES:4320}
      LOW: ${SLA_LOW_MINUTES:10080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.zidio.keystone: INFO
